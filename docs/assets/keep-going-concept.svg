<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Keep Going conceptual human-interruption comparison</title>
  <desc id="desc">An illustrative, not-to-scale task sequence. The default pattern shows AI work, a human handoff, resumed AI work, another human handoff, and resumed AI work. The Keep Going pattern shows continuous AI work across policy checks at Stop events, with a human off-ramp only for sensitive or uncertain decisions. Counts and outcomes are not measured.</desc>
  <rect width="1200" height="800" fill="#0b1020"/>

  <text x="60" y="58" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="750">Keep long tasks moving. Escalate when it matters.</text>
  <text x="60" y="96" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Conceptual sequence · counts not measured · not to scale</text>

  <rect x="40" y="128" width="1120" height="260" rx="24" fill="#141c32" stroke="#71809f" stroke-width="2"/>
  <text x="70" y="174" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">Default Stop pattern</text>
  <text x="70" y="207" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">The task repeatedly pauses and waits for a person before AI work can resume</text>

  <line x1="112" y1="276" x2="1088" y2="276" stroke="#4b5d7f" stroke-width="4"/>
  <path d="M1088 276 L1072 266 M1088 276 L1072 286" fill="none" stroke="#4b5d7f" stroke-width="4" stroke-linecap="round"/>

  <rect x="90" y="248" width="230" height="56" rx="14" fill="#315bca"/>
  <text x="205" y="283" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="750">AI works</text>

  <circle cx="380" cy="276" r="40" fill="#f1ad1d" stroke="#ffe09a" stroke-width="4"/>
  <text x="380" y="271" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">HUMAN</text>
  <text x="380" y="289" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">STEPS IN</text>

  <rect x="440" y="248" width="230" height="56" rx="14" fill="#315bca"/>
  <text x="555" y="283" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="750">AI resumes</text>

  <circle cx="730" cy="276" r="40" fill="#f1ad1d" stroke="#ffe09a" stroke-width="4"/>
  <text x="730" y="271" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="850">HUMAN</text>
  <text x="730" y="289" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">STEPS IN</text>

  <rect x="790" y="248" width="230" height="56" rx="14" fill="#315bca"/>
  <text x="905" y="283" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="750">AI resumes again</text>

  <text x="600" y="354" text-anchor="middle" fill="#ffe09a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">AI → human handoff → AI → human handoff → AI</text>

  <rect x="40" y="414" width="1120" height="300" rx="24" fill="#141c32" stroke="#71809f" stroke-width="2"/>
  <text x="70" y="460" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">Keep Going Stop pattern</text>
  <text x="70" y="493" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Low-risk Stop decisions continue without handing the task back to the person</text>

  <rect x="90" y="548" width="1020" height="64" rx="16" fill="#315bca"/>
  <text x="600" y="589" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">AI keeps working across policy-governed Stop checks</text>

  <line x1="365" y1="526" x2="365" y2="624" stroke="#b9a8ff" stroke-width="4"/>
  <circle cx="365" cy="526" r="13" fill="#b9a8ff"/>
  <path d="M358 526 L363 531 L373 520" fill="none" stroke="#141c32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="365" y="517" text-anchor="middle" fill="#ded6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">STOP · POLICY CHECK</text>
  <text x="365" y="643" text-anchor="middle" fill="#ded6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">low risk → continue</text>

  <line x1="690" y1="526" x2="690" y2="624" stroke="#b9a8ff" stroke-width="4"/>
  <circle cx="690" cy="526" r="13" fill="#b9a8ff"/>
  <path d="M683 526 L688 531 L698 520" fill="none" stroke="#141c32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="517" text-anchor="middle" fill="#ded6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">STOP · POLICY CHECK</text>
  <text x="690" y="643" text-anchor="middle" fill="#ded6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">low risk → continue</text>

  <circle cx="970" cy="612" r="7" fill="#f1ad1d"/>
  <line x1="970" y1="612" x2="970" y2="660" stroke="#f1ad1d" stroke-width="5"/>
  <line x1="970" y1="660" x2="1000" y2="660" stroke="#f1ad1d" stroke-width="5"/>
  <polygon points="1000,660 984,650 984,670" fill="#f1ad1d"/>
  <rect x="1000" y="632" width="132" height="56" rx="12" fill="#f1ad1d"/>
  <text x="1066" y="655" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="850">HUMAN</text>
  <text x="1066" y="675" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750">OFF-RAMP</text>
  <text x="855" y="680" text-anchor="end" fill="#ffe09a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">only when sensitive or uncertain</text>

  <line x1="90" y1="756" x2="1110" y2="756" stroke="#71809f" stroke-width="3"/>
  <line x1="90" y1="746" x2="90" y2="766" stroke="#71809f" stroke-width="3"/>
  <line x1="1110" y1="746" x2="1110" y2="766" stroke="#71809f" stroke-width="3"/>
  <text x="600" y="787" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Normalized task progress · not elapsed time</text>
</svg>
