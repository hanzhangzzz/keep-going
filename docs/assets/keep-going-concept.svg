<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Keep Going conceptual Stop-hook interaction model</title>
  <desc id="desc">An illustrative, not-to-scale comparison. A repeated handoff pattern is contrasted with AI work enclosed by a policy boundary at every Stop, with an example off-ramp to a human for sensitive or uncertain decisions. Counts and outcomes are not measured.</desc>
  <rect width="720" height="920" fill="#0b1020"/>

  <text x="48" y="66" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Keep long tasks moving.</text>
  <text x="48" y="108" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Escalate when it matters.</text>
  <text x="48" y="148" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">Illustrative patterns · counts not measured · not to scale</text>

  <rect x="40" y="190" width="640" height="234" rx="22" fill="#141c32" stroke="#71809f" stroke-width="2"/>
  <text x="66" y="232" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Default Stop pattern</text>
  <text x="66" y="268" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Work repeatedly hands control back to the human</text>
  <rect x="66" y="302" width="588" height="54" rx="12" fill="#2854c5"/>
  <text x="360" y="337" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">AI work</text>
  <rect x="84" y="378" width="552" height="22" rx="11" fill="#e5a927"/>
  <path d="M104 378 l18 0 -20 22 -18 0 Z M158 378 l18 0 -20 22 -18 0 Z M212 378 l18 0 -20 22 -18 0 Z M266 378 l18 0 -20 22 -18 0 Z M320 378 l18 0 -20 22 -18 0 Z M374 378 l18 0 -20 22 -18 0 Z M428 378 l18 0 -20 22 -18 0 Z M482 378 l18 0 -20 22 -18 0 Z M536 378 l18 0 -20 22 -18 0 Z M590 378 l18 0 -20 22 -18 0 Z" fill="#10182a" opacity="0.7"/>
  <text x="360" y="416" text-anchor="middle" fill="#ffe4a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">repeated human handoffs — frequency not claimed</text>

  <rect x="40" y="458" width="640" height="344" rx="22" fill="#141c32" stroke="#71809f" stroke-width="2"/>
  <text x="66" y="500" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Keep Going Stop pattern</text>
  <text x="66" y="536" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">The deterministic boundary runs at every Stop</text>

  <rect x="64" y="566" width="592" height="112" rx="18" fill="none" stroke="#b9a8ff" stroke-width="4"/>
  <text x="86" y="596" fill="#ded6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">POLICY BOUNDARY · EVERY STOP</text>
  <rect x="86" y="614" width="548" height="44" rx="10" fill="#2854c5"/>
  <text x="360" y="644" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">AI work with policy-governed continuation</text>

  <line x1="360" y1="678" x2="360" y2="720" stroke="#b9a8ff" stroke-width="4"/>
  <path d="M360 720 L348 702 M360 720 L372 702" fill="none" stroke="#b9a8ff" stroke-width="4" stroke-linecap="round"/>
  <rect x="136" y="720" width="448" height="58" rx="14" fill="#e5a927"/>
  <text x="360" y="746" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">HUMAN OFF-RAMP</text>
  <text x="360" y="770" text-anchor="middle" fill="#10182a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">example only · sensitive or uncertain decision</text>

  <line x1="66" y1="850" x2="654" y2="850" stroke="#71809f" stroke-width="3"/>
  <line x1="66" y1="841" x2="66" y2="859" stroke="#71809f" stroke-width="3"/>
  <line x1="654" y1="841" x2="654" y2="859" stroke="#71809f" stroke-width="3"/>
  <text x="360" y="890" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Normalized task progress · not elapsed time</text>
</svg>
