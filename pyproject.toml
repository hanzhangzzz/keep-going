[project]
name = "keep-going"
version = "0.1.0"
description = "Policy-driven Stop-hook harness for long-running coding agents"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1.7",
    "pydantic>=2.8.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.4.0",
]

[project.scripts]
keep-going = "keep_going.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keep_going"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
