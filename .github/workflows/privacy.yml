name: privacy-boundary

on:
  pull_request:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a pull_request event the default is the merge commit GitHub
          # synthesises for the PR. That object is regenerated on every push,
          # never enters this repository's history, and carries GitHub's own
          # committer identity, so auditing it audits GitHub rather than us.
          # Audit the branch head that will actually be merged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Keep PR heads in a namespace of our own. Mapping them into
      # refs/remotes/pull/<n> collides with any refs/remotes/pull/<n>/merge
      # checkout may have created, and git cannot hold both a ref and a
      # directory under one name. The audit walks --all either way.
      - run: git fetch origin '+refs/pull/*/head:refs/remotes/pullhead/*'
      - run: uv run python scripts/privacy-audit.py --history
      - run: uv run pytest tests/test_privacy_boundary.py tests/test_npm_package.py tests/test_package.py -q
      - run: npm --prefix packages/npm test
      - run: cd packages/npm && npm pack --dry-run --json
